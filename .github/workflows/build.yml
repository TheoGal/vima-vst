name: Build

# Builds Vima as VST3 for Windows (x64), macOS (universal: Apple Silicon and Intel) and Linux (x64)
# on every push, runs the test harness on Linux, and checks the plugins with pluginval.
# The PDF manual (docs/Vima Manual.pdf) is copied into each bundle's Contents/Resources by CMake.
# Pushing a tag like v1.0.0 publishes a GitHub Release with the three zips (the release job).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install JUCE dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libgl1-mesa-dev xvfb ninja-build

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVIMA_BUILD_TESTS=ON

      - name: Build tests
        run: cmake --build build --target VimaTests --parallel

      - name: Run tests
        run: xvfb-run -a ./build/VimaTests_artefacts/Release/VimaTests test-output

      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: Vima-test-screenshots
          path: test-output/*.png

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel --target Vima_VST3

      - name: Validate with pluginval
        shell: pwsh
        continue-on-error: true
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          ./pluginval/pluginval.exe --strictness-level 10 --validate-in-process --output-dir pluginval-log "build/Vima_artefacts/Release/VST3/Vima.vst3" 2>&1 | Tee-Object -FilePath pluginval-out.txt
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            # Report what failed as warnings on the run, readable without opening the log
            $current = ""; $n = 0
            foreach ($l in Get-Content pluginval-out.txt) {
              if ($l -match "Starting tests in: (.*)") { $current = $Matches[1].Trim() }
              if ($l -match "!!!|FAILED|Failed|failed|ERROR|Error") {
                if ($n -lt 25) { Write-Output "::warning title=pluginval Windows ($current)::$($l.Trim())" }
                $n++
              }
            }
            if ($n -eq 0) {
              Get-Content pluginval-out.txt -Tail 15 | ForEach-Object { Write-Output "::warning title=pluginval Windows (last lines)::$($_.Trim())" }
            }
            Write-Output "::warning title=pluginval Windows::exit code $code"
            exit 1
          }
          $groups = (Select-String -Path pluginval-out.txt -Pattern "Completed tests in").Count
          Write-Output "::notice title=pluginval Windows::passed, strictness 10 ($groups test groups completed)"

      - name: Package
        shell: pwsh
        run: |
          $out = "Vima-Windows-x64"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item -Recurse "build/Vima_artefacts/Release/VST3/Vima.vst3" $out
          Copy-Item LICENSE $out -ErrorAction SilentlyContinue
          Copy-Item "build/README.txt" $out
          Copy-Item "Resources/fonts/OFL-IBMPlex.txt" $out
          Compress-Archive -Path "$out/*" -DestinationPath "$out.zip" -Force

      # Upload the folder itself: GitHub zips artifacts on download, so this gives one zip
      # (uploading Vima-Windows-x64.zip gave a zip inside a zip). The release keeps the zip.
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: Vima-Windows-x64
          path: Vima-Windows-x64/

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-windows
          path: Vima-Windows-x64.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configure (universal binary)
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13

      - name: Build
        run: cmake --build build --config Release --parallel 3 --target Vima_VST3

      # Ad-hoc signature: required for Apple Silicon to load the code at all.
      # (Not notarized: that needs a paid Apple Developer account. See README.txt in the zip.)
      - name: Sign (ad-hoc)
        run: codesign --force --deep --sign - build/Vima_artefacts/Release/VST3/Vima.vst3

      - name: Validate with pluginval
        continue-on-error: true
        run: |
          curl -sSfLo pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip
          unzip -q pluginval.zip
          set +e
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --validate-in-process --output-dir pluginval-log build/Vima_artefacts/Release/VST3/Vima.vst3 2>&1 | tee pluginval-out.txt
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            # Report what failed as warnings on the run, readable without opening the log
            grep -E "!!!|FAILED|[Ff]ailed|ERROR|Error" pluginval-out.txt | head -25 | while read -r l; do echo "::warning title=pluginval macOS::$l"; done
            echo "::warning title=pluginval macOS::exit code $code"
            exit 1
          fi
          echo "::notice title=pluginval macOS::passed, strictness 10 ($(grep -c "Completed tests in" pluginval-out.txt) test groups completed)"

      - name: Package
        run: |
          OUT=Vima-macOS-universal
          mkdir -p "$OUT"
          ditto build/Vima_artefacts/Release/VST3/Vima.vst3 "$OUT/Vima.vst3"
          cp LICENSE "$OUT"/ 2>/dev/null || true
          cp build/README.txt "$OUT"/
          cp Resources/fonts/OFL-IBMPlex.txt "$OUT"/
          ditto -c -k --keepParent "$OUT" "Vima-macOS-plugin.zip"

      # The macOS zip stays inside the download on purpose: GitHub's artifact zip drops file
      # permissions, which would break the plugin bundle and its signature. It has its own name
      # (Vima-macOS-plugin.zip), so unzipping it next to the download does not clash.
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: Vima-macOS-universal
          path: Vima-macOS-plugin.zip

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-macos
          path: Vima-macOS-plugin.zip

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install JUCE dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libgl1-mesa-dev xvfb ninja-build zip

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel --target Vima_VST3

      - name: Validate with pluginval
        continue-on-error: true
        run: |
          curl -sSfLo pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Linux.zip
          unzip -q pluginval.zip
          set +e
          xvfb-run -a ./pluginval --strictness-level 10 --validate-in-process --output-dir pluginval-log build/Vima_artefacts/Release/VST3/Vima.vst3 2>&1 | tee pluginval-out.txt
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            grep -E "!!!|FAILED|[Ff]ailed|ERROR|Error" pluginval-out.txt | head -25 | while read -r l; do echo "::warning title=pluginval Linux::$l"; done
            echo "::warning title=pluginval Linux::exit code $code"
            exit 1
          fi
          echo "::notice title=pluginval Linux::passed, strictness 10"

      - name: Package
        run: |
          OUT=Vima-Linux-x64
          mkdir -p "$OUT"
          cp -r build/Vima_artefacts/Release/VST3/Vima.vst3 "$OUT/"
          cp LICENSE "$OUT"/ 2>/dev/null || true
          cp build/README.txt "$OUT"/
          cp Resources/fonts/OFL-IBMPlex.txt "$OUT"/
          zip -qr "$OUT.zip" "$OUT"

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: Vima-Linux-x64
          path: Vima-Linux-x64/

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-linux
          path: Vima-Linux-x64.zip

  # A tag like v1.0.0: one GitHub Release with the three zips, once all builds passed
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: release

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          name: Vima VST ${{ github.ref_name }}
          files: |
            release/Vima-Windows-x64.zip
            release/Vima-macOS-plugin.zip
            release/Vima-Linux-x64.zip
          body: |
            Vima is an 8-track melodic MIDI step sequencer (VST3) for your DAW.

            Downloads:
            - **Windows (x64):** Vima-Windows-x64.zip. Copy the Vima.vst3 folder to C:\Program Files\Common Files\VST3\
            - **macOS (Apple Silicon and Intel):** Vima-macOS-plugin.zip. Not notarized: see README.txt inside.
            - **Linux (x64):** Vima-Linux-x64.zip. Copy Vima.vst3 to ~/.vst3/

            The full manual is inside the plugin (Settings > MANUAL) and in [MANUAL.md](https://github.com/TheoGal/vima-vst/blob/main/MANUAL.md).
