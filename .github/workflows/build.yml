name: Build

# Builds VIMA as VST3 for Windows (x64) and macOS (universal: Apple Silicon and Intel)
# on every push, runs the test harness on Linux, and checks the plugins with pluginval.
# Pushing a tag like v1.0.0 also attaches both zips to that GitHub Release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install JUCE dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libgl1-mesa-dev xvfb ninja-build

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVIMA_BUILD_TESTS=ON

      - name: Build tests
        run: cmake --build build --target VimaTests --parallel

      - name: Run tests
        run: xvfb-run -a ./build/VimaTests_artefacts/Release/VimaTests test-output

      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: Vima-test-screenshots
          path: test-output/*.png

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel --target Vima_VST3

      - name: Validate with pluginval
        shell: pwsh
        continue-on-error: true
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          ./pluginval/pluginval.exe --strictness-level 10 --validate-in-process --output-dir pluginval-log "build/Vima_artefacts/Release/VST3/Vima.vst3"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Package
        shell: pwsh
        run: |
          $out = "Vima-Windows-x64"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item -Recurse "build/Vima_artefacts/Release/VST3/Vima.vst3" $out
          Copy-Item LICENSE, README.md $out -ErrorAction SilentlyContinue
          Copy-Item "Resources/fonts/OFL-IBMPlex.txt" $out
          Compress-Archive -Path "$out/*" -DestinationPath "$out.zip" -Force

      # Upload the folder itself: GitHub zips artifacts on download, so this gives one zip
      # (uploading Vima-Windows-x64.zip gave a zip inside a zip). The release keeps the zip.
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: Vima-Windows-x64
          path: Vima-Windows-x64/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: Vima-Windows-x64.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configure (universal binary)
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13

      - name: Build
        run: cmake --build build --config Release --parallel 3 --target Vima_VST3

      # Ad-hoc signature: required for Apple Silicon to load the code at all.
      # (Not notarized: that needs a paid Apple Developer account. See INSTALL-macOS.txt.)
      - name: Sign (ad-hoc)
        run: codesign --force --deep --sign - build/Vima_artefacts/Release/VST3/Vima.vst3

      - name: Validate with pluginval
        continue-on-error: true
        run: |
          curl -sSfLo pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --validate-in-process --output-dir pluginval-log build/Vima_artefacts/Release/VST3/Vima.vst3

      - name: Package
        run: |
          OUT=Vima-macOS-universal
          mkdir -p "$OUT"
          ditto build/Vima_artefacts/Release/VST3/Vima.vst3 "$OUT/Vima.vst3"
          cp LICENSE README.md "$OUT"/ 2>/dev/null || true
          cp Resources/fonts/OFL-IBMPlex.txt "$OUT"/
          cat > "$OUT/INSTALL-macOS.txt" <<'EOF'
          VIMA for macOS (Apple Silicon and Intel)

          1. Copy Vima.vst3 to /Library/Audio/Plug-Ins/VST3/
             (the main Library folder at the top of the disk; macOS asks for your password)

          2. This build is not notarized by Apple, so macOS blocks it at first.
             Open Terminal and run:

             xattr -dr com.apple.quarantine /Library/Audio/Plug-Ins/VST3/Vima.vst3

          3. Restart your DAW.

          VIMA is VST3 only: the Audio Unit format cannot send MIDI out of a plugin.
          EOF
          ditto -c -k --keepParent "$OUT" "Vima-macOS-plugin.zip"

      # The macOS zip stays inside the download on purpose: GitHub's artifact zip drops file
      # permissions, which would break the plugin bundle and its signature. It has its own name
      # (Vima-macOS-plugin.zip), so unzipping it next to the download does not clash.
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: Vima-macOS-universal
          path: Vima-macOS-plugin.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: Vima-macOS-plugin.zip
